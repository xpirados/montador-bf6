const ArmaSkins21=(()=>{
 let weapon,models,config,textures,skins=[],original={},keys={},active=null,preview=null,previewing=false,epoch=0,opened=false,previousTitle='',originalFragments={},lastIds=[];
 const loaded=new Map(),deferredModels=new Map();
 const eligible=s=>s.available&&s.family==='weaponpackage'&&s.nameProof?.literal===s.name;
 function validate(s){
  if(s.weapon!==weapon)throw Error('Pacote ligado a outra arma');
  if(s.name!==s.expectedName)throw Error('Nome do pacote divergente da fonte');
  if(!s.nameProof||s.nameProof.literal!==s.name)throw Error('Nome do pacote sem prova de localização');

 }
 async function script(file,kind){
  if(!(new RegExp('^arma-'+kind+'-[a-f0-9]{64}\\.js$')).test(file))throw Error('Arquivo de pacote inválido');

  // própria função original de registro e conserva o array que ele usará.
  // A malha real e os buffers só existem após escolher o pacote; shader,
  // câmera e implementação do renderer permanecem os mesmos.

   m[mid]={sections:{map(register){deferred.register=register;return deferred.buffers;}}};

 }
 function bind(m){
  // Cada seção ganha IDs próprios. A textura do corpo não invade cartucho/lente
  // nem outra seção que antes reutilizava a mesma URL.
  for(const [mid,model] of Object.entries(m)){
   m[mid]={...model,sections:model.sections.map((section,i)=>{
    const s={...section},key=mid+'|'+s.name,binding={};
    for(const role of ['texture','nmt','smooth']){
     if(!s[role])continue;const id='ars21|'+mid+'|'+i+'|'+role;
     original[id]=textures[s[role]];textures[id]=textures[s[role]];s[role]=id;binding[role]=id;

   })};

 }
 function load(s){
  if(!s)return Promise.resolve();validate(s);

   for(const [mid,model] of Object.entries(added)){
